# Reverse proxy: the only service published to the LAN.
#  - /                  -> Django (gunicorn)
#  - /stream/hls/...    -> MediaMTX HLS, every request authorised by Django (auth_request)
#  - /protected/...     -> internal only; Django hands files over via X-Accel-Redirect
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    types { video/x-matroska mkv; }
    default_type application/octet-stream;

    # No query strings in logs (they could carry tokens in the future).
    log_format main '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    server_tokens off;
    client_max_body_size 2m;
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # Docker's embedded DNS, so containers can restart with new IPs.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    server {
        listen 8080 default_server;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;

        set $django http://web:8000;
        set $mediamtx_hls http://mediamtx:8888;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # --- Live streams (HLS playlists + segments) --------------------------
        location /stream/hls/ {
            auth_request /_auth/stream;
            auth_request_set $auth_status $upstream_status;

            rewrite ^/stream/hls/(.*)$ /$1 break;
            proxy_pass $mediamtx_hls;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            # MediaMTX answers the first playlist request with a cookie-check redirect
            # to an absolute path; keep it under our prefix and drop its cookie.
            proxy_redirect / /stream/hls/;
            proxy_hide_header Set-Cookie;
            proxy_hide_header Cache-Control;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_buffering off;
            proxy_read_timeout 30s;
            add_header Cache-Control "private, no-store" always;
            add_header X-Content-Type-Options nosniff always;
        }

        location = /_auth/stream {
            internal;
            proxy_pass $django/internal/stream-auth/;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        # --- Files handed over by Django (X-Accel-Redirect) ---------------------
        location /protected/recordings/ {
            internal;
            alias /srv/recordings/;
            add_header Cache-Control "private, max-age=0" always;
            add_header X-Content-Type-Options nosniff always;
        }

        location /protected/playback-cache/ {
            internal;
            alias /srv/cache/playback/;
            types { video/mp4 mp4; }
            add_header Cache-Control "private, max-age=0" always;
            add_header X-Content-Type-Options nosniff always;
        }

        # Never expose the internal auth endpoint directly.
        location /internal/ { return 404; }

        # --- Django ---------------------------------------------------------------
        location / {
            proxy_pass $django;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 120s;
            proxy_buffering on;
        }
    }
}
